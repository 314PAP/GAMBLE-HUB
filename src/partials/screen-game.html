      <section
        id="screen-game"
        class="screen flex flex-col h-full min-h-0 pb-2"
        aria-labelledby="game-title"
      >
        <header
          class="flex flex-col bg-black rounded-xl px-3 py-1 gap-1 shrink-0"
          role="region"
          aria-label="Herní lišta"
        >
          <div class="flex items-center justify-between w-full gap-2">
            <div id="game-title" class="game-title" aria-hidden="true">AUTOMAT</div>
            <div class="flex items-center gap-1.5 shrink-0">
              <div class="text-sm truncate text-neon-gold text-glow-gold">
                <span id="game-player-name"></span>
              </div>
              <button
                class="btn-info-toggle w-[clamp(24px,5.5vw,32px)] h-[clamp(24px,5.5vw,32px)] flex items-center justify-center rounded-md shrink-0"
                id="btn-game-info"
                onclick="toggleInfoPanel()"
                aria-label="Jak se hraje"
              >
                <svg
                  class="w-[58%] h-[58%]"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 17v-5" />
                  <path d="M12 7h.01" />
                </svg>
              </button>
              <button
                class="sound-toggle-btn w-[clamp(24px,5.5vw,32px)] h-[clamp(24px,5.5vw,32px)] flex items-center justify-center rounded-md shrink-0"
                id="global-sound-toggle"
                onclick="toggleMuteState()"
                title="Zvuk"
                aria-label="Přepnout zvuk"
              >
                <svg
                  class="w-[58%] h-[58%]"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                </svg>
              </button>
              <button
                class="music-toggle-btn w-[clamp(24px,5.5vw,32px)] h-[clamp(24px,5.5vw,32px)] flex items-center justify-center rounded-md shrink-0"
                id="global-music-toggle"
                onclick="toggleMusicState()"
                title="Hudba"
                aria-label="Přepnout hudbu na pozadí"
              >
                <svg
                  class="w-[58%] h-[58%]"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9 18V5l12-2v13" />
                  <circle cx="6" cy="18" r="3" />
                  <circle cx="18" cy="16" r="3" />
                </svg>
              </button>
              <button
                class="theme-toggle-btn w-[clamp(24px,5.5vw,32px)] h-[clamp(24px,5.5vw,32px)] flex items-center justify-center rounded-md shrink-0"
                id="global-theme-toggle"
                onclick="toggleTheme()"
                title="Přepnout téma"
                aria-label="Přepnout barevné téma"
              >
                <svg
                  class="w-[58%] h-[58%]"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="5" />
                  <path
                    d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div
            class="w-full flex justify-center text-center text-[clamp(0.95rem,3.5vw,1.25rem)] text-neon-green text-glow-green font-bold py-0.5"
          >
            <span class="score-display flex items-center justify-center gap-1.5">
              <span id="game-player-money"></span>
              <svg class="coin-icon-svg w-[1.1em] h-[1.1em]" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="11" fill="url(#goldGradient)" />
                <text
                  x="12"
                  y="17"
                  font-size="12"
                  font-weight="bold"
                  text-anchor="middle"
                  fill="#1a1a2e"
                >
                  $
                </text>
              </svg>
            </span>
          </div>
        </header>

        <article
          id="slots-area"
          class="game-container hidden p-2 flex flex-col justify-between"
          aria-labelledby="slots-title"
        >
          <h3 id="slots-title" class="sr-only">Automat</h3>
          <div class="game-main flex flex-col flex-1 min-h-0 items-center justify-center py-1">
            <div
              class="slot-machine w-full h-full max-w-[420px] aspect-[4/3] p-1.5 rounded-2xl relative"
              role="region"
              aria-label="Automat"
            >
              <div
                class="slot-grid flex gap-1.5 h-full w-full rounded-xl relative z-[1] overflow-hidden p-1"
              >
                <div class="slot-reel flex-1 h-full rounded-lg overflow-hidden relative">
                  <div class="slot-reel-container flex flex-col w-full" id="reel-container-0"></div>
                </div>
                <div class="slot-reel flex-1 h-full rounded-lg overflow-hidden relative">
                  <div class="slot-reel-container flex flex-col w-full" id="reel-container-1"></div>
                </div>
                <div class="slot-reel flex-1 h-full rounded-lg overflow-hidden relative">
                  <div class="slot-reel-container flex flex-col w-full" id="reel-container-2"></div>
                </div>
              </div>
            </div>
            <div
              id="game-result-slots"
              class="game-result-slot"
              role="status"
              aria-live="polite"
            ></div>
          </div>
          <div class="game-actions py-1 shrink-0">
            <div
              class="slot-controls flex justify-center gap-2 w-full max-w-[360px] mx-auto"
              role="region"
              aria-label="Ovládání automatu"
            >
              <button
                class="btn btn-spin-slots py-2 px-4 text-sm font-bold flex-1"
                id="btn-spin-slots"
                onclick="kliknutoCislo(0)"
              >
                <span class="icon-node" aria-hidden="true"></span> SPIN
              </button>
              <button
                class="btn btn-auto-slots py-2 px-4 text-sm font-bold flex-1"
                id="btn-auto-slots"
                onclick="toggleAutoPlay()"
              >
                <span class="icon-node" aria-hidden="true"></span> AUTO
              </button>
            </div>
          </div>
        </article>

        <article id="hilo-area" class="game-container hidden" aria-labelledby="hilo-title">
          <h3 id="hilo-title" class="sr-only">HI-LOW</h3>
          <div
            class="game-main flex flex-col flex-1 min-h-0 overflow-hidden items-center justify-center"
          >
            <div
              class="flex-1 flex flex-col justify-center items-center w-full min-h-0 py-2"
              role="region"
              aria-label="HI-LOW hra"
            >
              <div
                id="hilo-current-card"
                class="hilo-card-face flex items-center justify-center h-full max-h-[42svh] aspect-[2/3] text-[clamp(36px,9vh,72px)] select-none"
              >
                5
              </div>
            </div>
            <div
              id="hilo-streak-info"
              class="text-xs font-bold tracking-wider mb-1 text-text-secondary"
              aria-live="polite"
            >
              Vyšší: 1.71× | Nižší: 2.14×
            </div>
            <div
              id="game-result-hilo"
              class="game-result-hilo mb-1"
              role="status"
              aria-live="polite"
            ></div>
          </div>
          <div class="game-actions pt-1 shrink-0">
            <div
              class="hilo-btns flex justify-center gap-2 mb-2"
              role="region"
              aria-label="Ovládání HI-LOW"
            >
              <button class="btn btn-primary flex-1" id="btn-hilo-high" onclick="hrajHiLo('H')">
                <span class="icon-node" aria-hidden="true"></span> VYŠŠÍ
              </button>
              <button
                class="btn btn-gold flex-1 hidden"
                id="btn-hilo-cashout"
                onclick="cashOutHiLo()"
              >
                💰 VYBRAT
              </button>
              <button class="btn btn-danger flex-1" id="btn-hilo-low" onclick="hrajHiLo('L')">
                <span class="icon-node" aria-hidden="true"></span> NIŽŠÍ
              </button>
            </div>
          </div>
        </article>

        <article id="mines-area" class="game-container hidden" aria-labelledby="mines-title">
          <h3 id="mines-title" class="sr-only">Miny 5×5</h3>
          <div
            class="game-main flex flex-col flex-1 min-h-0 overflow-hidden items-center justify-center gap-2"
          >
            <div class="flex items-center gap-1.5" role="group" aria-label="Počet min">
              <span class="text-xs text-text-secondary font-semibold mr-1">Miny:</span>
              <button
                type="button"
                class="btn-bet mines-count-btn px-2.5 py-1 text-xs"
                data-mines-count="1"
                onclick="setMinesCount(1)"
              >
                1
              </button>
              <button
                type="button"
                class="btn-bet mines-count-btn active px-2.5 py-1 text-xs"
                data-mines-count="3"
                onclick="setMinesCount(3)"
              >
                3
              </button>
              <button
                type="button"
                class="btn-bet mines-count-btn px-2.5 py-1 text-xs"
                data-mines-count="5"
                onclick="setMinesCount(5)"
              >
                5
              </button>
              <button
                type="button"
                class="btn-bet mines-count-btn px-2.5 py-1 text-xs"
                data-mines-count="10"
                onclick="setMinesCount(10)"
              >
                10
              </button>
            </div>
            <div id="mines-grid" class="mines-grid" role="grid" aria-label="Herní pole min"></div>
            <div
              id="mines-status-info"
              class="text-xs font-bold tracking-wider text-text-secondary text-center"
              aria-live="polite"
            >
              Počet min: 3 | První krok: 1.09×
            </div>
            <div
              id="game-result-mines"
              class="game-result mb-1 hidden"
              role="status"
              aria-live="polite"
            ></div>
          </div>
          <div class="game-actions pt-1 shrink-0">
            <div class="flex justify-center gap-2 mb-2">
              <button
                class="btn btn-primary flex-1"
                id="btn-mines-start"
                onclick="startMines()"
              >
                ▶ START HRY
              </button>
              <button
                class="btn btn-gold flex-1 hidden"
                id="btn-mines-cashout"
                onclick="cashOutMines()"
                disabled
              >
                💰 VYBRAT
              </button>
            </div>
          </div>
        </article>

        <article id="classic-inputs" class="game-container hidden" aria-labelledby="classic-title">
          <h3 id="classic-title" class="sr-only">Výběr čísla</h3>
          <div
            class="game-main flex flex-col flex-1 min-h-0 overflow-hidden items-center justify-center"
          >
            <p
              class="text-center text-[#ff9f1c] font-['Press_Start_2P',monospace] text-[clamp(10px,2.5vw,13px)] mb-1 text-glow-orange uppercase tracking-wider"
            >
              Vyber si číslo: <span class="sr-only">Kliknutím vyberte číslo 0-36</span>
            </p>
            <div
              class="flex-1 flex justify-center items-center w-full min-h-0 py-1"
              role="region"
              aria-label="Ruleta výřez"
            >
              <div
                class="roulette-frame flex items-center justify-center h-full max-h-[38svh] aspect-square p-1.5 min-h-0"
                role="group"
                aria-label="Výběr čísla"
              >
                <div
                  id="game-number-buttons"
                  class="w-full h-full grid grid-cols-6 gap-0.5 sm:gap-1 p-1 items-center justify-center min-h-0"
                ></div>
              </div>
            </div>
            <div
              id="roulette-side-bets"
              class="hidden w-full max-w-[360px] flex-col gap-1 mb-1 px-1 shrink-0"
              role="group"
              aria-label="Vedlejší sázky rulety"
            >
              <div class="grid grid-cols-4 gap-1">
                <button
                  class="roulette-side-btn btn btn-red py-1 text-[10px] sm:text-xs"
                  onclick="vsaditRuletaVedlejsi('red')"
                >
                  Červená 2x
                </button>
                <button
                  class="roulette-side-btn btn py-1 text-[10px] sm:text-xs border border-white/30 bg-black/70 text-white"
                  onclick="vsaditRuletaVedlejsi('black')"
                >
                  Černá 2x
                </button>
                <button
                  class="roulette-side-btn btn btn-info py-1 text-[10px] sm:text-xs"
                  onclick="vsaditRuletaVedlejsi('even')"
                >
                  Sudá 2x
                </button>
                <button
                  class="roulette-side-btn btn btn-purple py-1 text-[10px] sm:text-xs"
                  onclick="vsaditRuletaVedlejsi('odd')"
                >
                  Lichá 2x
                </button>
              </div>
              <div class="grid grid-cols-5 gap-1">
                <button
                  class="roulette-side-btn btn btn-primary py-1 text-[10px]"
                  onclick="vsaditRuletaVedlejsi('low')"
                >
                  1-18
                </button>
                <button
                  class="roulette-side-btn btn btn-primary py-1 text-[10px]"
                  onclick="vsaditRuletaVedlejsi('high')"
                >
                  19-35
                </button>
                <button
                  class="roulette-side-btn btn btn-gold py-1 text-[10px]"
                  onclick="vsaditRuletaVedlejsi('dozen1')"
                >
                  1-12 (3x)
                </button>
                <button
                  class="roulette-side-btn btn btn-gold py-1 text-[10px]"
                  onclick="vsaditRuletaVedlejsi('dozen2')"
                >
                  13-24 (3x)
                </button>
                <button
                  class="roulette-side-btn btn btn-gold py-1 text-[10px]"
                  onclick="vsaditRuletaVedlejsi('dozen3')"
                >
                  25-35 (3x)
                </button>
              </div>
            </div>
            <div
              id="game-result-classic"
              class="game-result-classic mb-1"
              role="status"
              aria-live="polite"
            ></div>
          </div>
        </article>

        <article id="dice-area" class="game-container hidden" aria-labelledby="dice-title">
          <h3 id="dice-title" class="sr-only">Kostka</h3>
          <div
            class="game-main flex flex-col flex-1 min-h-0 overflow-hidden items-center justify-center"
          >
            <p
              class="text-center text-[#ff9f1c] font-['Press_Start_2P',monospace] text-xs mb-2 text-glow-orange uppercase tracking-wider"
            >
              Vyber číslo:
            </p>
            <div class="flex-1 flex justify-center items-center w-full min-h-0 py-2">
              <div
                id="dice-frame"
                class="dice-frame flex items-center justify-center relative backdrop-blur-md overflow-hidden h-full max-h-[30svh] aspect-square select-none"
                role="region"
                aria-label="Zobrazení kostky"
              >
                <span
                  id="dice-display"
                  class="dice-display text-[clamp(2.5rem,7vh,4.5rem)]"
                  aria-live="polite"
                  aria-atomic="true"
                  >?</span
                >
              </div>
            </div>
            <div
              id="game-result-dice"
              class="game-result-dice mb-1"
              role="status"
              aria-live="polite"
            ></div>
          </div>
          <div class="game-actions pb-1 shrink-0">
            <div
              class="dice-numbers-grid grid grid-cols-3 gap-2 justify-center max-w-[240px] mx-auto"
              role="region"
              aria-label="Ovládání Kostky"
            >
              <button
                class="btn dice-num-btn py-1.5 px-2 text-sm font-bold w-full"
                data-num="1"
                aria-label="Sázet na 1"
              >
                1
              </button>
              <button
                class="btn dice-num-btn py-1.5 px-2 text-sm font-bold w-full"
                data-num="2"
                aria-label="Sázet na 2"
              >
                2
              </button>
              <button
                class="btn dice-num-btn py-1.5 px-2 text-sm font-bold w-full"
                data-num="3"
                aria-label="Sázet na 3"
              >
                3
              </button>
              <button
                class="btn dice-num-btn py-1.5 px-2 text-sm font-bold w-full"
                data-num="4"
                aria-label="Sázet na 4"
              >
                4
              </button>
              <button
                class="btn dice-num-btn py-1.5 px-2 text-sm font-bold w-full"
                data-num="5"
                aria-label="Sázet na 5"
              >
                5
              </button>
              <button
                class="btn dice-num-btn py-1.5 px-2 text-sm font-bold w-full"
                data-num="6"
                aria-label="Sázet na 6"
              >
                6
              </button>
            </div>
          </div>
        </article>

        <nav
          id="bet-area"
          class="flex flex-col gap-1.5 mt-1.5 mb-1.5 shrink-0"
          role="region"
          aria-label="Volba sázky"
        >
          <!-- Řada 1: preset tlačítka + rychlé akce -->
          <div class="grid grid-cols-7 gap-1 justify-center justify-items-stretch">
            <button class="btn bet-btn h-9" id="bet-10" onclick="nastavSazku(10)">10</button>
            <button class="btn bet-btn h-9" id="bet-20" onclick="nastavSazku(20)">20</button>
            <button class="btn bet-btn h-9" id="bet-50" onclick="nastavSazku(50)">50</button>
            <button class="btn bet-btn h-9" id="bet-100" onclick="nastavSazku(100)">100</button>
            <button
              class="btn bet-btn h-9"
              id="bet-half"
              onclick="nasobSazku(0.5)"
              aria-label="Poloviční sázka"
            >
              1/2×
            </button>
            <button
              class="btn bet-btn h-9"
              id="bet-double"
              onclick="nasobSazku(2)"
              aria-label="Dvojnásobná sázka"
            >
              2×
            </button>
            <button
              class="btn bet-btn h-9"
              id="bet-all-in"
              onclick="vsaditVse()"
              aria-label="Vsadit vše (all-in)"
            >
              MAX
            </button>
          </div>
          <!-- Řada 2: Bet Slider -->
          <div id="bet-slider-container" role="none"></div>
          <div
            class="text-[10px] text-text-muted text-center tracking-wide hidden sm:block"
            aria-label="Klávesové zkratky"
          >
            Zkratky: Space = Spin/Start | ←/→ = Sázka | H/L = Hi-Lo | M = Zvuk
          </div>
        </nav>

        <div
          id="game-result"
          class="status-box game-result-classic hidden"
          role="status"
          aria-live="polite"
        ></div>

        <div
          class="flex justify-center w-full gap-3 shrink-0 pb-1"
          role="group"
          aria-label="Akce během hry"
        >
          <button class="btn btn-stats flex-1 py-2" onclick="otevriStatsModal()">Statistiky</button>
          <button class="btn btn-danger flex-1 py-2" onclick="navratDoHubu()">Menu</button>
        </div>
      </section>
