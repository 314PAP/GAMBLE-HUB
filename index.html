<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAMBLE HUB</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GAMBLE HUB" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a12'/%3E%3Ctext x='50' y='60' font-family='Arial' font-size='50' text-anchor='middle'%3E🎰%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <svg width="0" height="0" class="svg-defs" aria-hidden="true">
      <defs>
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffec8a" />
          <stop offset="50%" stop-color="#ffd700" />
          <stop offset="100%" stop-color="#d4af37" />
        </linearGradient>
      </defs>
    </svg>
    <main
      class="container w-[92vw] h-[86dvh] sm:w-[clamp(320px,90vw,600px)] sm:h-[85svh] sm:min-h-[500px] sm:max-h-[900px] flex flex-col overflow-hidden relative z-10 border-8 rounded-2xl p-2 bg-black"
      role="main"
      aria-label="Herní aplikace"
    >
      <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
      <section
        id="screen-login"
        class="screen active flex flex-col h-full overflow-y-auto bg-black"
        aria-labelledby="login-title"
      >
        <h1 id="login-title" class="mb-4 flex items-center justify-between w-full">
          <span>GAMBLE HUB</span>
          <div class="flex items-center gap-1.5 shrink-0">
            <button
              class="sound-toggle-btn w-[28px] h-[28px] flex items-center justify-center rounded-md shrink-0"
              id="login-sound-toggle"
              onclick="toggleMuteState()"
              title="Zvuk"
              aria-label="Přepnout zvuk"
            >
              <svg class="w-[58%] h-[58%]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              </svg>
            </button>
            <button
              class="music-toggle-btn w-[28px] h-[28px] flex items-center justify-center rounded-md shrink-0"
              id="login-music-toggle"
              onclick="toggleMusicState()"
              title="Hudba"
              aria-label="Přepnout hudbu na pozadí"
            >
              <svg class="w-[58%] h-[58%]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
              </svg>
            </button>
          </div>
        </h1>

        <!-- Leaderboard karta -->
        <div
          id="leaderboard-card"
          class="leaderboard-card-clickable rounded-2xl mb-5 cursor-pointer transition-all w-full overflow-hidden relative border-2 border-transparent animate-[scoreBorderGlow_4s_linear_infinite]"
          onclick="otevriExplorer()"
          aria-label="Zobrazit globální žebříček a historii"
          role="button"
          tabindex="0"
        >
          <div class="font-['Orbitron'] text-xs text-neon-gold uppercase tracking-wider pb-2">
            <span class="flex items-center gap-2.5">Top Hráči <span class="leaderboard-badge"></span></span>
          </div>
          <div
            id="leaderboard-content"
            role="list"
            class="flex flex-col pl-0 pr-2 pb-2 max-h-48 overflow-y-auto"
          >
            <span class="text-neon-gold text-xs italic text-glow-gold">Načítám žebříček...</span>
          </div>
        </div>

        <div class="flex flex-col gap-3 w-full">
          <button
            type="button"
            id="btn-enter"
            class="btn btn-primary w-full py-3"
            onclick="otevriPrihlaseni()"
          >
            VSTOUPIT
          </button>
          <button
            type="button"
            id="btn-create-player"
            class="btn btn-success w-full py-3"
            onclick="otevriRegistraci()"
          >
            NOVÝ HRÁČ
          </button>
        </div>
        <div class="text-center mt-5">
          <button
            onclick="otevriDisclaimer()"
            class="text-[clamp(9px,2.8vw,12px)] tracking-wider whitespace-nowrap text-[#ff007f] font-['Orbitron'] font-bold hover:text-white uppercase transition-all duration-300 bg-transparent border-0 cursor-pointer text-glow-pink"
          >
            ⚠️ WARNING / DISKLEJMR ⚠️
          </button>
        </div>
      </section>

      <section id="screen-select-user" class="screen p-4" aria-labelledby="select-user-title">
        <h2 id="select-user-title" class="text-center mb-3">Vyber Účet</h2>
        <div
          id="users-list"
          role="list"
          aria-label="Seznam dostupných účtů"
          class="max-h-56 overflow-y-auto my-4 flex flex-col gap-3 pr-1"
        ></div>
        <button class="btn btn-danger w-full py-3" onclick="zpetDoMenu()">Zpět</button>
      </section>

      <section id="screen-register" class="screen p-4" aria-labelledby="register-title">
        <h2 id="register-title">Nový Hráč</h2>
        <input
          type="text"
          id="reg-name"
          placeholder="Zadej jméno (max 5 znaků)"
          maxlength="5"
          aria-label="Jméno hráče"
          onkeydown="checkEnter(event, potvrditRegistraci)"
          class="px-4 py-2 mb-3"
        />
        <div class="flex flex-col gap-2.5" role="group" aria-label="Registrace">
          <button class="btn btn-success w-full py-3" onclick="potvrditRegistraci()">
            Vytvořit účet
          </button>
          <button class="btn btn-danger w-full py-3" onclick="zpetDoMenu()">Zpět</button>
        </div>
      </section>

      <section
        id="screen-hub"
        class="screen flex flex-col h-full min-h-0 overflow-y-auto bg-black p-2"
      >
        <header
          class="game-header-bar bg-black rounded-xl mb-1.5 px-3 py-1.5 shrink-0"
          role="region"
          aria-label="Herní lišta"
        >
          <div class="flex items-center justify-between w-full gap-2 min-w-0 shrink">
            <div class="text-sm truncate text-neon-gold flex items-center gap-2">
              <span id="hub-player-name" class="sr-only">Jméno hráče</span>
              <span id="hub-vip-badge" class="text-xs px-2 py-0.5 rounded-full bg-white/5 border border-neon-gold/30"></span>
            </div>
            <div
              class="text-base sm:text-lg font-bold whitespace-nowrap text-neon-green text-glow-green"
            >
              <span class="score-display flex items-center gap-1.5"
                ><span id="hub-player-money"></span
                ><svg
                  class="coin-icon-svg w-[1.1em] h-[1.1em]"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="11" fill="url(#goldGradient)" />
                  <text
                    x="12"
                    y="17"
                    font-size="12"
                    font-weight="bold"
                    text-anchor="middle"
                    fill="#1a1a2e"
                  >
                    $
                  </text>
                </svg></span
              >
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button
                class="w-[28px] h-[28px] flex items-center justify-center rounded-md shrink-0 border border-neon-gold/60 bg-neon-gold/15 text-xs transition-opacity"
                id="hub-daily-bonus-btn"
                onclick="vyzvednoutDenniBonus()"
                title="Denní bonus"
                aria-label="Vyzvednout denní bonus"
              >
                🎁
              </button>
              <button
                class="sound-toggle-btn w-[28px] h-[28px] flex items-center justify-center rounded-md shrink-0"
                id="hub-sound-toggle"
                onclick="toggleMuteState()"
                title="Zvuk"
                aria-label="Přepnout zvuk"
              >
                <svg
                  class="w-[58%] h-[58%]"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                </svg>
              </button>
              <button
                class="music-toggle-btn w-[28px] h-[28px] flex items-center justify-center rounded-md shrink-0"
                id="hub-music-toggle"
                onclick="toggleMusicState()"
                title="Hudba"
                aria-label="Přepnout hudbu na pozadí"
              >
                <svg
                  class="w-[58%] h-[58%]"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9 18V5l12-2v13" />
                  <circle cx="6" cy="18" r="3" />
                  <circle cx="18" cy="16" r="3" />
                </svg>
              </button>
            </div>
          </div>
        </header>
        <div
          id="hub-live-ticker"
          class="hidden text-[11px] text-neon-gold bg-black/60 border border-neon-gold/30 rounded-lg px-2.5 py-1 mb-1.5 truncate shrink-0"
          aria-live="polite"
        ></div>
        <div
          id="hub-missions-widget"
          class="grid grid-cols-3 gap-1.5 mb-1.5 shrink-0 relative z-10"
          aria-label="Denní mise"
        ></div>
        <div
          id="game-loading"
          class="hidden flex-col items-center justify-center p-4 absolute inset-0 z-20 bg-black/80 backdrop-blur-sm"
        >
          <div class="text-center">
            <div class="text-neon-cyan text-glow-cyan text-lg mb-2">
              ⏳ Načítání hry...
            </div>
            <div class="text-text-muted text-sm">Připojujeme herní moduly</div>
          </div>
        </div>
        <nav
          aria-label="Výběr hry"
          class="flex flex-col gap-1.5 py-1 px-1 overflow-y-auto flex-1 min-h-0 justify-center"
        >
          <button
            class="btn btn-gold w-full py-2 text-xs sm:text-sm whitespace-nowrap shrink-0"
            onclick="spustitHru(5)"
          >
            AUTOMAT
          </button>
          <button
            class="btn btn-danger w-full py-2 text-xs sm:text-sm whitespace-nowrap shrink-0"
            onclick="spustitHru(6)"
          >
            HI-LOW
          </button>
          <button
            class="btn btn-red w-full py-2 text-xs sm:text-sm whitespace-nowrap shrink-0"
            onclick="spustitHru(4)"
          >
            Ruleta 0-36 (36x)
          </button>
          <button
            class="btn btn-primary w-full py-2 text-xs sm:text-sm whitespace-nowrap shrink-0"
            onclick="spustitHru(2)"
          >
            Hádanka 1-5 (5x)
          </button>
          <button
            class="btn btn-purple w-full py-2 text-xs sm:text-sm whitespace-nowrap shrink-0"
            onclick="spustitHru(3)"
          >
            Kostka 1-6 (6x)
          </button>
          <button
            class="btn btn-info w-full py-2 text-xs sm:text-sm whitespace-nowrap shrink-0 col-span-2"
            onclick="spustitHru(7)"
          >
            Miny 5×5 (Cash Out)
          </button>
          <button
            class="btn btn-gold w-full py-2 text-xs sm:text-sm whitespace-nowrap shrink-0 col-span-2"
            onclick="spustitHru(8)"
          >
            Crash (Cash Out)
          </button>
          <button
            class="btn btn-neon w-full py-2 text-xs sm:text-sm whitespace-nowrap shrink-0 col-span-2"
            onclick="spustitHru(9)"
          >
            Blackjack (2.5×)
          </button>
          <button
            class="btn btn-info w-full py-2 text-xs sm:text-sm whitespace-nowrap shrink-0 col-span-2"
            onclick="spustitHru(10)"
          >
            Kolo štěstí (10×)
          </button>
        </nav>
        <button
          id="btn-logout"
          class="btn btn-danger w-full py-2 text-xs sm:text-sm mt-1.5 shrink-0"
          onclick="odhlasitSe()"
        >
          Opustit hernu
        </button>
      </section>
      <section
        id="screen-splash"
        class="screen flex flex-col items-center justify-center h-full bg-black z-50 p-4 select-none"
        aria-label="Spouštění hry"
      >
        <div class="splash-logo-container flex flex-col items-center justify-center">
          <h1 class="splash-logo-title text-center">GAMBLE HUB</h1>
        </div>
      </section>

      <!-- @include src/partials/screen-game.html -->

      <section id="screen-socka" class="screen socka-screen p-4" aria-labelledby="socka-title">
        <div class="socka-icon text-5xl mb-4" aria-hidden="true">💀</div>
        <h2 id="socka-title" class="socka-title mb-3">Čistá Kasa</h2>
        <p id="socka-text" class="socka-desc mb-4"></p>
        <button
          id="socka-bailout-btn"
          class="btn btn-gold w-full mb-2"
          onclick="vyzvednoutZachranu()"
        >
          🎁 Záchranný kredit (+200)
        </button>
        <p id="socka-bailout-hint" class="text-xs text-text-muted mb-3 text-center hidden"></p>
        <button class="btn btn-danger w-full" onclick="zpetDoMenu()">Zpět na začátek</button>
      </section>
    </main>

    <!-- @include src/partials/modals.html -->
  </body>
  <script type="module" src="/src/main.js"></script>
</html>
