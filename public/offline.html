<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAMBLE HUB - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0a12;
      color: #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }
    p {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, rgba(189, 0, 255, 0.2), rgba(6, 182, 212, 0.2));
      border: 2px solid #bd00ff;
      border-radius: 8px;
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(189, 0, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Jste offline</h1>
    <p>GAMBLE HUB potřebuje připojení k internetu pro první načtení. Zkontrolujte připojení a zkuste to znovu.</p>
    <a href="/GAMBLE-HUB/" class="btn" onclick="window.location.reload()">Zkusit znovu</a>
  </div>
</body>
</html>
